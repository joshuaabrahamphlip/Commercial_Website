  <!DOCTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWMESON</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="top-header">

      <div class="logo">
        <a href="#home"><span>AW</span>ME<span>SON</span></a>
      </div>

    
      <div class="search-bar">
        <input type="text" placeholder="Search for products">
        <button class="search-btn">Search</button>
      </div>

    </header>

    <!-- ===== NAVIGATION BAR ===== -->
    <nav class="category-nav">
      <a>All</a>
      <a>Electronics</a>
      <a>Fashion</a>
      <a>Home & Kitchen</a>
      <a>Books</a>
      <a>Toys</a>
      <a>Deals</a>
    </nav>

    <main>


      <!-- ===== PRODUCTS SECTION ===== -->
      <section id="products" class="products-section">
        <h2>Popular Products</h2>

        <div class="product-grid">

          <div class="product-card">
            <img class="product-image" src="phone.png" alt="Smartphone">
            <h3>Smartphone</h3>
            <p class="price">₹14,999</p>
            <button class="btn btn-cart">BUY NOW</button>
          </div>

          <div class="product-card">
            <img class="product-image" src="headphones.png" alt="Wireless Headphones">
            <h3>Wireless Headphones</h3>
            <p class="price">₹1,999</p>
            <button class="btn btn-cart">BUY NOW</button>
          </div>

          <div class="product-card">
            <img class="product-image" src="watch.png" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹2,499</p>
            <button class="btn btn-cart">BUY NOW</button>
          </div>

          <div class="product-card">
            <img class="product-image" src="shoes.png" alt="Running Shoes">
            <h3>Running Shoes</h3>
            <p class="price">₹1,299</p>
            <button class="btn btn-cart">BUY NOW</button>
          </div>


        </div>
      </section>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
      <div class="footer-links">

        <div class="footer-column">
          <h4>Connect with Us</h4>
          <a href="#">Facebook</a>
          <a href="#">Instagram</a>
          <a href="#">Twitter</a>
        </div>

      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 AWMESON</p>
      </div>
    </footer>

  </body>
  </html>
